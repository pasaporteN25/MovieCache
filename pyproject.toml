[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-inbox"
version = "0.5.0"
description = "Personal movie catalog, scanner and local web viewer."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Lucas"}]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx2>=2,<3"]
browser-test = ["playwright>=1.48,<2"]
dev = ["ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
movie-inbox = "movie_inbox.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"movie_inbox.web" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/css/*.css",
    "static/js/*.js",
    "static/js/core/*.js",
    "static/js/surfaces/*.js",
]
"movie_inbox.search_lab" = ["corpus/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) is idiomatic in argument defaults.
"src/movie_inbox/web/app.py" = ["B008"]
"src/movie_inbox/web/dependencies.py" = ["B008"]
"src/movie_inbox/web/routers/*.py" = ["B008"]
# Compatibility-only viewer with an embedded HTML/CSS/JS template; wrapping the
# JS template literals would risk introducing a syntax error for no real benefit.
"scripts/build_viewer.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
# Test doubles intentionally mirror dynamic third-party callbacks. Their bodies
# are still checked; only annotations and calls between those helpers are optional.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "tests.browser.*"
# unittest class fixtures install Playwright resources during setUpClass.
disable_error_code = ["attr-defined"]
