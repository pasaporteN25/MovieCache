name: tests

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff / mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src scripts tests
      - name: ruff format --check
        run: ruff format --check src scripts tests
      - name: mypy (domain, strict)
        run: mypy src/movie_inbox/domain

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  search-lab:
    name: search quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Enforce the v0.3.0 search-quality gate
        run: movie-inbox search-lab run --enforce

  wheel-smoke:
    name: built wheel / clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/movie-inbox-wheel"
          "$RUNNER_TEMP/movie-inbox-wheel/bin/python" -m pip install dist/*.whl
      - name: Smoke-test command, packaged assets and server
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/movie-inbox-wheel/bin/movie-inbox" --help
          "$RUNNER_TEMP/movie-inbox-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"

  browser-smoke:
    name: Chromium / accessible responsive shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and browser test dependencies
        run: python -m pip install -e ".[test,browser-test]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser acceptance test
        run: python -m unittest discover -s tests/browser -p "test_*.py" -v

  docker-smoke:
    name: Docker Compose / persistent state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Docker inputs
        shell: bash
        run: |
          mkdir -p backups imports media secrets
          printf '%s' 'a-long-docker-smoke-password' > secrets/owner-password.txt
          printf '%s\n' '{"schema_version":5,"items":[{"id":"heat","title":"Heat","year":"1995","kind":"pelicula"}]}' > imports/catalog.json
          printf '%s' 'video' > media/Heat.1995.mkv
      - name: Build image and import catalog
        shell: bash
        run: |
          docker compose build
          docker compose run --rm movie-inbox db import /imports/catalog.json --db /var/lib/movie-inbox/movie-inbox.db
      - name: Start and verify container
        shell: bash
        run: |
          docker compose up --detach
          container_id="$(docker compose ps --quiet movie-inbox)"
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id" | grep -q 'ALL'
          curl --fail --silent http://127.0.0.1:8765/healthz | grep -q '"status":"ok"'
          docker compose exec -T movie-inbox sh -c 'test ! -w /media/library/disco1'
          docker compose exec -T movie-inbox sh -c 'test ! -w /imports'
          docker compose exec -T movie-inbox movie-inbox db info /var/lib/movie-inbox/movie-inbox.db | grep -q -- '- Items: 1'
          docker compose restart movie-inbox
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          docker compose exec -T movie-inbox movie-inbox db info /var/lib/movie-inbox/movie-inbox.db | grep -q -- '- Items: 1'
      - name: Create and verify instance backup
        shell: bash
        run: |
          docker compose exec -T movie-inbox sh -c \
            'umask 077; printf private-state > /var/lib/movie-inbox/.private-backup-smoke'
          bash scripts/docker-backup.sh
          archive="$(find backups -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          test -f "$archive.sha256"
          tar -tzf "$archive" | grep -q 'movie-inbox/.private-backup-smoke'
          docker compose run --rm --no-deps movie-inbox-backup backup verify "/backups/$(basename "$archive")"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove smoke environment
        if: always()
        run: docker compose down --volumes --remove-orphans
