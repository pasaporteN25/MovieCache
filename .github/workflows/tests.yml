name: tests

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  wheel-smoke:
    name: built wheel / clean environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/movie-inbox-wheel"
          "$RUNNER_TEMP/movie-inbox-wheel/bin/python" -m pip install dist/*.whl
      - name: Smoke-test command, packaged assets and server
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/movie-inbox-wheel/bin/movie-inbox" --help
          "$RUNNER_TEMP/movie-inbox-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/wheel_smoke.py"
