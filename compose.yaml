name: movie-inbox

services:
  movie-inbox:
    build:
      context: .
      args:
        PYTHON_VERSION: ${MOVIE_INBOX_PYTHON_VERSION:-3.11}
    image: ${MOVIE_INBOX_IMAGE:-movie-inbox:local}
    command:
      - serve
      - /var/lib/movie-inbox/movie-inbox.db
      - --instance-db
      - /var/lib/movie-inbox/instance.db
      - --member-catalog-dir
      - /var/lib/movie-inbox/catalogs
      - --image-cache-dir
      - /var/lib/movie-inbox/image-cache
      - --image-cache-total-mb
      - ${MOVIE_INBOX_IMAGE_CACHE_MB:-512}
      - --image-cache-warm-mode
      - ${MOVIE_INBOX_IMAGE_WARM_MODE:-after-access}
      - --image-cache-warm-interval-seconds
      - ${MOVIE_INBOX_IMAGE_WARM_INTERVAL_SECONDS:-3}
      - --owner-username
      - ${MOVIE_INBOX_OWNER_USERNAME:-owner}
      - --owner-password-file
      - /run/secrets/owner_password
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --public-origin
      - ${MOVIE_INBOX_PUBLIC_ORIGIN:-http://localhost:8765}
      - --forwarded-allow-ips
      - ${MOVIE_INBOX_FORWARDED_ALLOW_IPS:-127.0.0.1}
      - --session-days
      - ${MOVIE_INBOX_SESSION_DAYS:-30}
      - --library-root
      - /media/library
      - --no-open
    ports:
      - "${MOVIE_INBOX_BIND_ADDRESS:-127.0.0.1}:${MOVIE_INBOX_PORT:-8765}:8765"
    volumes:
      - movie-inbox-data:/var/lib/movie-inbox
      - type: bind
        source: ${MOVIE_INBOX_MEDIA_PATH:-./media}
        target: /media/library/disco1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MOVIE_INBOX_IMPORT_PATH:-./imports}
        target: /imports
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - owner_password
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    stop_grace_period: 30s

  movie-inbox-backup:
    image: ${MOVIE_INBOX_IMAGE:-movie-inbox:local}
    profiles:
      - maintenance
    command:
      - backup
      - create
      - /var/lib/movie-inbox
      - --output-dir
      - /backups
      - --retention-days
      - ${MOVIE_INBOX_BACKUP_RETENTION_DAYS:-14}
    user: "0:0"
    network_mode: none
    volumes:
      - movie-inbox-data:/var/lib/movie-inbox:ro
      - type: bind
        source: ${MOVIE_INBOX_BACKUP_PATH:-./backups}
        target: /backups
        read_only: false
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges=true

secrets:
  owner_password:
    file: ${MOVIE_INBOX_OWNER_PASSWORD_FILE:-./secrets/owner-password.txt}

volumes:
  movie-inbox-data:
