<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="movie-inbox-token" content="__MOVIE_INBOX_TOKEN__">
    <title>Actualizar acceso &middot; __MOVIE_INBOX_TITLE__</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body class="login-shell">
    <main class="login-main">
      <section class="login-stage" aria-labelledby="passwordTitle">
        <header class="login-brand">
          <span class="brand-kicker">Video club // credencial temporal</span>
          <h1>__MOVIE_INBOX_TITLE__</h1>
          <p>Eleg&iacute; tu contrase&ntilde;a antes de abrir el cat&aacute;logo.</p>
        </header>

        <div class="login-pass password-pass">
          <div class="login-pass-stripe" aria-hidden="true">
            <span>MEMBER</span>
            <strong>RESET</strong>
            <span>ACCESS</span>
          </div>
          <div class="login-pass-body">
            <div class="login-heading">
              <span class="eyebrow">Cambio obligatorio</span>
              <h2 id="passwordTitle">Nueva contrase&ntilde;a</h2>
            </div>
            <form id="passwordChangeForm" class="login-form">
              <label>
                <span>Contrase&ntilde;a temporal</span>
                <input id="currentPassword" name="current_password" type="password" autocomplete="current-password" required autofocus>
              </label>
              <label>
                <span>Nueva contrase&ntilde;a</span>
                <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
              </label>
              <label>
                <span>Repetir nueva contrase&ntilde;a</span>
                <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
              </label>
              <label class="login-password-toggle">
                <input id="showPasswords" type="checkbox">
                <span>Mostrar contrase&ntilde;as</span>
              </label>
              <p id="passwordFeedback" class="login-feedback" role="alert" aria-live="polite" hidden></p>
              <button id="passwordSubmit" class="login-submit" type="submit">Guardar y entrar</button>
            </form>
          </div>
          <footer class="login-pass-footer">
            <span>M&iacute;nimo 12 caracteres</span>
            <button id="passwordLogout" class="login-exit" type="button">Salir</button>
          </footer>
        </div>
      </section>
    </main>
    <script src="/static/password-change.js"></script>
  </body>
</html>
