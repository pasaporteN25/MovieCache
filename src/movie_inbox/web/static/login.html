<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="movie-inbox-token" content="__MOVIE_INBOX_TOKEN__">
    <title>Acceso &middot; __MOVIE_INBOX_TITLE__</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body class="login-shell">
    <main class="login-main">
      <section class="login-stage" aria-labelledby="loginTitle">
        <header class="login-brand">
          <span class="brand-kicker">Video club // acceso privado</span>
          <h1>__MOVIE_INBOX_TITLE__</h1>
          <p>M&aacute;s que tu cat&aacute;logo personal.</p>
        </header>

        <div class="login-pass member-login-pass">
          <div class="login-pass-stripe" aria-hidden="true">
            <span>MEMBER</span>
            <strong>PLAY</strong>
            <span>ARCHIVE</span>
          </div>
          <div class="login-pass-body">
            <h2 id="loginTitle" class="sr-only">Acceso de socio</h2>
            <div class="login-member-layout">
              <div class="login-member-data">
                <div class="login-member-number">
                  <span>Socio</span>
                  <strong>N&deg; A0101235</strong>
                </div>
                <form id="loginForm" class="login-form">
                  <label>
                    <span>Usuario</span>
                    <input id="loginUsername" name="username" autocomplete="username" required autofocus>
                  </label>
                  <div class="login-field">
                    <label for="loginPassword">Contrase&ntilde;a</label>
                    <div class="login-password-field">
                      <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                      <button
                        id="showPassword"
                        class="login-password-visibility"
                        type="button"
                        aria-label="Mostrar contrase&ntilde;a"
                        aria-controls="loginPassword"
                        aria-pressed="false"
                        title="Mostrar contrase&ntilde;a"
                      >
                        <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                          <path d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"></path>
                          <circle cx="12" cy="12" r="2.75"></circle>
                          <path class="login-eye-slash" d="m4 4 16 16"></path>
                        </svg>
                      </button>
                    </div>
                  </div>
                  <p id="loginFeedback" class="login-feedback" role="alert" aria-live="polite" hidden></p>
                  <button id="loginSubmit" class="login-submit" type="submit">
                    <span id="loginSubmitLabel">Entrar</span>
                    <span class="login-submit-mark" aria-hidden="true">&#9654;</span>
                  </button>
                </form>
              </div>
              <div class="login-member-photo" aria-hidden="true">
                <div class="login-photo-frame"></div>
              </div>
            </div>
          </div>
          <footer class="login-pass-footer">
            <span>Emisi&oacute;n: instancia privada</span>
            <span>Presentar para ingresar</span>
          </footer>
        </div>
      </section>
    </main>
    <script src="/static/login.js"></script>
  </body>
</html>
